<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookup — network trace utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0E1A;
    --panel: #10162A;
    --panel-line: #1E2740;
    --text: #D7DCEA;
    --text-dim: #6B7590;
    --cyan: #4FD8E8;
    --cyan-dim: #2A6B75;
    --amber: #F2A65A;
    --red: #E86A6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,216,232,0.08), transparent 60%),
      var(--ink);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 48px 24px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.02em;
    color: #fff;
  }
  h1 span { color: var(--cyan); }
  .base-url {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .base-url input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--panel-line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 2px 0;
    width: 190px;
  }
  .base-url input:focus { outline: none; border-color: var(--cyan-dim); color: var(--text); }

  .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 32px;
  }

  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--cyan-dim); color: #EAFCFF; }

  .query-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .query-row input[type=text] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
  }
  .query-row input[type=text]:focus {
    outline: none;
    border-color: var(--cyan-dim);
  }
  .query-row input[type=text]::placeholder { color: var(--text-dim); }

  button.run {
    background: var(--cyan);
    color: #05171A;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: filter .15s, transform .1s;
  }
  button.run:hover { filter: brightness(1.1); }
  button.run:active { transform: scale(0.98); }
  button.run:disabled { background: var(--panel-line); color: var(--text-dim); cursor: not-allowed; }

  .hint { font-size: 12px; color: var(--text-dim); margin: 6px 2px 28px; min-height: 16px; }

  .console {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    overflow: hidden;
  }

  .console-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-line);
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .status-dot.live {
    background: var(--cyan);
    box-shadow: 0 0 0 0 rgba(79,216,232,0.6);
    animation: pulse 1.1s infinite;
  }
  .status-dot.ok { background: #6EE7A0; }
  .status-dot.err { background: var(--red); }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79,216,232,0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(79,216,232,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,216,232,0); }
  }

  .console-body {
    padding: 18px 16px 22px;
    font-size: 13.5px;
    line-height: 1.85;
    min-height: 120px;
  }

  .line {
    opacity: 0;
    transform: translateY(3px);
    animation: reveal .32s forwards;
    display: flex;
    gap: 10px;
  }
  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

  .line .key { color: var(--amber); flex-shrink: 0; min-width: 90px; }
  .line .val { color: var(--text); word-break: break-all; }
  .line .val.mono-list { color: var(--cyan); }

  .empty-state { color: var(--text-dim); font-style: normal; }
  .error-line { color: var(--red); }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 28px;
  }

  ::selection { background: var(--cyan-dim); color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>look<span>up</span>.</h1>
      <div class="base-url">
        server &nbsp;<input id="baseUrl" type="text" value="http://127.0.0.1:8000" spellcheck="false">
      </div>
    </header>
    <p class="sub">DNS, reverse DNS, and geolocation, read straight off the wire.</p>

    <div class="tabs">
      <button class="tab active" data-mode="dns">DNS</button>
      <button class="tab" data-mode="reverse-dns">Reverse DNS</button>
      <button class="tab" data-mode="geolocation">Geolocation</button>
    </div>

    <div class="query-row">
      <input id="queryInput" type="text" placeholder="google.com">
      <button class="run" id="runBtn">Trace</button>
    </div>
    <div class="hint" id="hint">Enter a domain name, e.g. google.com</div>

    <div class="console">
      <div class="console-bar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">idle</span>
      </div>
      <div class="console-body" id="consoleBody">
        <div class="empty-state">Results will appear here once you run a trace.</div>
      </div>
    </div>

    <footer>local FastAPI service · /dns · /reverse-dns · /geolocation</footer>
  </div>

<script>
  const modes = {
    'dns': { placeholder: 'google.com', hint: 'Enter a domain name, e.g. google.com', path: d => `/dns/${d}` },
    'reverse-dns': { placeholder: '8.8.8.8', hint: 'Enter a public IP address, e.g. 8.8.8.8', path: d => `/reverse-dns/${d}` },
    'geolocation': { placeholder: '8.8.8.8', hint: 'Enter a public IP address (private IPs are rejected)', path: d => `/geolocation/${d}` },
  };

  let currentMode = 'dns';

  const tabs = document.querySelectorAll('.tab');
  const input = document.getElementById('queryInput');
  const hint = document.getElementById('hint');
  const runBtn = document.getElementById('runBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const consoleBody = document.getElementById('consoleBody');
  const baseUrlInput = document.getElementById('baseUrl');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      input.placeholder = modes[currentMode].placeholder;
      hint.textContent = modes[currentMode].hint;
    });
  });

  function setStatus(state, label) {
    statusDot.className = 'status-dot' + (state ? ' ' + state : '');
    statusText.textContent = label;
  }

  function renderLines(pairs) {
    consoleBody.innerHTML = '';
    pairs.forEach((p, i) => {
      const line = document.createElement('div');
      line.className = 'line';
      line.style.animationDelay = (i * 0.06) + 's';
      line.innerHTML = `<span class="key">${p.key}</span><span class="val${p.mono ? ' mono-list' : ''}">${p.val}</span>`;
      consoleBody.appendChild(line);
    });
  }

  function fmtList(arr) {
    if (!arr || arr.length === 0) return '<span style="color:var(--text-dim)">none</span>';
    return arr.map(v => v.replace(/</g,'&lt;')).join('<br>');
  }

  async function runQuery() {
    const val = input.value.trim();
    if (!val) { hint.textContent = 'Type something to trace first.'; return; }

    const base = baseUrlInput.value.trim().replace(/\/$/, '');
    const path = modes[currentMode].path(encodeURIComponent(val));
    const url = base + path;

    runBtn.disabled = true;
    setStatus('live', 'querying ' + val + ' …');
    consoleBody.innerHTML = '<div class="empty-state">awaiting response…</div>';

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        setStatus('err', 'error ' + res.status);
        consoleBody.innerHTML = `<div class="error-line">${(data.detail || 'Request failed.').toString().replace(/</g,'&lt;')}</div>`;
        return;
      }

      setStatus('ok', 'resolved');

      let pairs = [];
      if (currentMode === 'dns') {
        pairs = [
          { key: 'domain', val: data.domain },
          { key: 'A', val: fmtList(data.A), mono: true },
          { key: 'AAAA', val: fmtList(data.AAAA), mono: true },
          { key: 'MX', val: fmtList(data.MX), mono: true },
          { key: 'NS', val: fmtList(data.NS), mono: true },
          { key: 'CNAME', val: fmtList(data.CNAME), mono: true },
          { key: 'TXT', val: fmtList(data.TXT), mono: true },
          { key: 'SOA', val: fmtList(data.SOA), mono: true },
        ];
      } else if (currentMode === 'reverse-dns') {
        pairs = [
          { key: 'ip', val: data.ip || val },
          { key: 'hostname', val: data.hostname || '—' },
          { key: 'aliases', val: fmtList(data.aliases), mono: true },
        ];
      } else if (currentMode === 'geolocation') {
        pairs = Object.entries(data).map(([k, v]) => ({ key: k, val: String(v) }));
      }
      renderLines(pairs);

    } catch (err) {
      setStatus('err', 'connection failed');
      consoleBody.innerHTML = `<div class="error-line">Could not reach ${base}. Is the server running? (${err.message})</div>`;
    } finally {
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener('click', runQuery);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') runQuery(); });
</script>
</body>
</html>
