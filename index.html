<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="LOOKUP — DNS, reverse DNS and IP geolocation toolkit.">
  <title>LOOKUP — Network Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070a12;
      --bg-soft: #0b1020;
      --panel: rgba(14, 20, 37, .82);
      --panel-solid: #0e1425;
      --panel-2: #111a2f;
      --line: rgba(135, 157, 201, .16);
      --line-strong: rgba(135, 157, 201, .28);
      --text: #eef3ff;
      --muted: #8995ad;
      --muted-2: #5e6a82;
      --cyan: #5de2f2;
      --cyan-2: #25bfd5;
      --green: #67e6a3;
      --amber: #f4b76a;
      --red: #ff7078;
      --shadow: 0 28px 80px rgba(0,0,0,.34);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle 700px at 10% -5%, rgba(49, 191, 216, .11), transparent 62%),
        radial-gradient(circle 600px at 95% 10%, rgba(105, 92, 255, .08), transparent 62%),
        linear-gradient(180deg, #070a12 0%, #090d18 100%);
      font-family: "DM Sans", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 64px;
      position: relative;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 72px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -.03em;
      font-size: 19px;
    }
    
    .brand-mark {
      width: 30px;
      height: 30px;
      border: 1px solid rgba(93,226,242,.45);
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: rgba(93,226,242,.07);
      box-shadow: inset 0 0 20px rgba(93,226,242,.06);
    }

    .brand-mark::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(93,226,242,.8);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .server {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
      font: 12px "IBM Plex Mono", monospace;
    }

    .server input {
      width: 180px;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
    }

    .server input:focus { color: var(--cyan); }

    .link-btn, .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: .18s ease;
      cursor: pointer;
    }

    .link-btn:hover, .ghost-btn:hover {
      color: var(--text);
      border-color: var(--line-strong);
      background: rgba(255,255,255,.05);
      transform: translateY(-1px);
    }

    /* Hero */
    .hero {
      max-width: 830px;
      margin: 0 auto 44px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(93,226,242,.17);
      border-radius: 999px;
      background: rgba(93,226,242,.055);
      color: #a8eff7;
      font: 11px "IBM Plex Mono", monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(103,230,163,.75);
    }

    h1 {
      margin: 18px 0 14px;
      font-size: clamp(48px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 700;
    }

    h1 .accent { color: var(--cyan); }

    .hero p {
      max-width: 620px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 23px;
    }

    .stat {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      font: 11px "IBM Plex Mono", monospace;
    }
