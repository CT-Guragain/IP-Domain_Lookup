<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070a12">
  <meta name="description" content="LOOKUP — DNS, reverse DNS and IP geolocation toolkit.">
  <title>LOOKUP — Network Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070a12;
      --bg-soft: #0b1020;
      --panel: rgba(14, 20, 37, .82);
      --panel-solid: #0e1425;
      --panel-2: #111a2f;
      --line: rgba(135, 157, 201, .16);
      --line-strong: rgba(135, 157, 201, .28);
      --text: #eef3ff;
      --muted: #8995ad;
      --muted-2: #5e6a82;
      --cyan: #5de2f2;
      --cyan-2: #25bfd5;
      --green: #67e6a3;
      --amber: #f4b76a;
      --red: #ff7078;
      --shadow: 0 28px 80px rgba(0,0,0,.34);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle 700px at 10% -5%, rgba(49, 191, 216, .11), transparent 62%),
        radial-gradient(circle 600px at 95% 10%, rgba(105, 92, 255, .08), transparent 62%),
        linear-gradient(180deg, #070a12 0%, #090d18 100%);
      font-family: "DM Sans", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }
